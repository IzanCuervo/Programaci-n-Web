<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset = "utf-8">
        <!-- REVISIÓN: añade <meta name="viewport" content="width=device-width, initial-scale=1"> para que se vea bien en el móvil. -->
        <link href="expendekai.css" rel="stylesheet" type="text/css">
        <!-- REVISIÓN (línea de abajo): type="text/javascript" sobra en HTML5, es el valor por defecto. Además, las dos
             líneas siguientes están sangradas con tabuladores y el resto del archivo con espacios: usa siempre lo mismo. -->
		<script type= "text/javascript" src="expendekai.js" defer></script>
		<title>Expendekai</title>
    </head>

    <body>

        <header>
            <h1>Expendekai</h1>
            <p>Monedas: <span id="monedas">0</span></p>
            <p>Tiradas: <span id="tiradas">0</span></p>
            <button id="generaMonedas" class="botones">Consigue Monedas</button>
        </header>
        <main>
            <video id="tirada" class="oculto" src="videos/tirada.mp4"></video>
            <section>
                <div class="zonaInvocacion">
                    <button id="invocacion1" class="botones">Invocación x1</button>
                    <button id="invocacion8" class="botones">Invocación x8</button>
                </div>
                <ol id="resultado"></ol>
                <p id="error"></p>
            </section>

            <section>
                <button id="medalium" class="botones">Medalium</button>
                <div id="contenidoMedalium" class="oculto">
                    <section id="medalium-E">
                        <h3>Rango E</h3>
                    </section>
                    <section id="medalium-D">
                        <h3>Rango D</h3>
                    </section>
                    <section id="medalium-C">
                        <h3>Rango C </h3>
                    </section>
                    <section id="medalium-B">
                        <h3>Rango B</h3>
                    </section>
                    <section id="medalium-A">
                        <h3>Rango A</h3>
                    </section>
                    <section id="medalium-S">
                        <h3>Rango S</h3>
                    </section>
                </div>
            </section>

        </main>
        
    </body>
</html>
