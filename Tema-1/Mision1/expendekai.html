<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset = "utf-8">
        <link href="expendekai.css" rel="stylesheet" type="text/css">
		<script type= "text/javascript" src="expendekai.js" defer></script>
		<title>Expendekai</title>
    </head>

    <body>

        <header>
            <h1>Expendekai</h1>
            <p>Monedas: <span id="monedas">0</span></p>
            <p>Tiradas: <span id="tiradas">0</span></p>
            <button id="generaMonedas" class="botones">Consigue Monedas</button>
        </header>
        <main>
            <video id="tirada" class="oculto" src="videos/tirada.mp4"></video>
            <section>
                <div class="zonaInvocacion">
                    <button id="invocacion1" class="botones">Invocación x1</button>
                    <button id="invocacion8" class="botones">Invocación x8</button>
                </div>
                <!-- Tiene tanto la clase caja como la clase oculto-->
                <div id="cajaResultado" class="caja oculto">
                    <ol id="resultado"></ol>
                    <button id="cerrarResultado" class="botones">Aceptar</button>
                </div>
                <p id="error"></p>
            </section>

            <section>
                <button id="medalium" class="botones">Medalium</button>
                <div id="contenidoMedalium" class="caja oculto">
                    <section id="medalium-E">
                        <h3>Rango E</h3>
                    </section>
                    <section id="medalium-D">
                        <h3>Rango D</h3>
                    </section>
                    <section id="medalium-C">
                        <h3>Rango C </h3>
                    </section>
                    <section id="medalium-B">
                        <h3>Rango B</h3>
                    </section>
                    <section id="medalium-A">
                        <h3>Rango A</h3>
                    </section>
                    <section id="medalium-S">
                        <h3>Rango S</h3>
                    </section>
                    <button id="cerrarMedalium" class="botones">Aceptar</button>
                </div>
               
            </section>

        </main>
        
    </body>
</html>
