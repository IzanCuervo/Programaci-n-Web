<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset = "utf-8">
        <!-- REVISIÓN: añade <meta name="viewport" content="width=device-width, initial-scale=1"> para que se vea bien en el móvil. -->
        <!-- REVISIÓN: cuando crees tu CSS, enlázalo aquí: <link rel="stylesheet" href="expendekai.css"> -->
        <!-- REVISIÓN (línea de abajo): type="text/javascript" sobra en HTML5, es el valor por defecto. Además, las dos
             líneas siguientes están sangradas con tabuladores y el resto del archivo con espacios: usa siempre lo mismo. -->
		<script type= "text/javascript" src="expendekai.js" defer></script>
		<title>Expendekai</title>
    </head>

    <body>

        <header>
            <h1>Expendekai</h1>
            <p>Monedas: <span id="monedas">0</span></p>
            <p>Tiradas: <span id="tiradas">0</span></p>
            <!-- REVISIÓN (pista): falta la forma de conseguir monedas. Decide cómo (un botón, una tecla, con el
                 paso del tiempo...) y qué elemento necesitas aquí para que el JS pueda escucharlo. -->
        </header>
        <main>
            <section>
                <button id="invocacion1">Invocación x1</button>
                <p id="resultado1"></p>
                <button id="invocacion8">Invocación x8</button>
                <!-- REVISIÓN: cámbialo por <ol id="resultado8"></ol> y crea un <li> por tirada desde el JS (ver
                     expendekai.js). El <ol> ya numera solo, así que puedes quitar el "${i + 1}." del texto.
                     Y añade un <p id="avisos"></p> para los mensajes de error de los dos botones. -->
                <p id="error">No dispones de suficientes monedas</p>
                <p id="resultado8"></p>
            </section>

            <section>
                <button id="medalium">Medalium</button>
                <!-- REVISIÓN (pista): piensa si el Medalium debe verse al cargar la página o solo al pulsar el botón. -->
                <div id="contenidoMedalium">

                </div>
            </section>

        </main>
        
    </body>
</html>
